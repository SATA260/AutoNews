<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <rect width="880" height="560" fill="#FFFFFF" />
  <line x1="40" y1="68" x2="840" y2="68" stroke="#18181B" stroke-width="2" />
  <text x="40" y="47" fill="#18181B" font-family="Inter, PingFang SC, sans-serif" font-size="22" font-weight="800">OpenAI 技术博客 · 桌面语音视觉端到端延迟</text>
  <text x="840" y="47" text-anchor="end" fill="#52525B" font-family="monospace" font-size="16" font-weight="600">openai.com/index</text>

  <text x="40" y="114" fill="#27272A" font-family="Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">语音交互链路延迟对比 (平均响应毫秒数)</text>

  <!-- Legacy pipeline -->
  <g transform="translate(40, 146)" font-family="Inter, PingFang SC, monospace">
    <text x="0" y="24" fill="#52525B" font-size="19" font-weight="700">传统三段串联（语音转文字 → LLM → 语音合成）</text>
    <rect x="0" y="40" width="190" height="48" fill="#E4E4E7" />
    <rect x="194" y="40" width="310" height="48" fill="#D4D4D8" />
    <rect x="508" y="40" width="160" height="48" fill="#A1A1AA" />
    <text x="95" y="70" text-anchor="middle" fill="#27272A" font-size="17" font-weight="700">ASR 520ms</text>
    <text x="349" y="70" text-anchor="middle" fill="#27272A" font-size="17" font-weight="700">LLM 1,450ms</text>
    <text x="588" y="70" text-anchor="middle" fill="#18181B" font-size="17" font-weight="700">TTS 430ms</text>
    <text x="684" y="72" fill="#52525B" font-size="22" font-weight="800">2,400 ms</text>
  </g>

  <!-- Native pipeline -->
  <g transform="translate(40, 272)" font-family="Inter, PingFang SC, monospace">
    <text x="0" y="24" fill="#18181B" font-size="20" font-weight="800">新版统一多模态实时流（本次发布）</text>
    <rect x="0" y="40" width="108" height="48" fill="#059669" />
    <text x="54" y="71" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">220ms</text>
    <text x="128" y="72" fill="#059669" font-size="24" font-weight="800">220 ms（延迟降 90.8%，支持随时插话打断）</text>
  </g>

  <line x1="40" y1="392" x2="840" y2="392" stroke="#E4E4E7" stroke-width="1.5" />

  <g transform="translate(40, 428)" font-family="Inter, PingFang SC, sans-serif">
    <text x="0" y="0" fill="#18181B" font-size="20" font-weight="800">官方披露桌面端关键能力</text>
    <text x="0" y="36" fill="#27272A" font-size="19" font-weight="600">• 实时解析当前激活窗口画面并同步语音指导</text>
    <text x="0" y="70" fill="#27272A" font-size="19" font-weight="600">• 原生适配 macOS 与 Windows，支持按单窗口授权边界</text>
  </g>
</svg>
