<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <rect width="880" height="560" fill="#FFFFFF" />
  <line x1="40" y1="68" x2="840" y2="68" stroke="#18181B" stroke-width="2" />
  <text x="40" y="47" fill="#18181B" font-family="Inter, PingFang SC, sans-serif" font-size="22" font-weight="800">DeepSeek 技术报告 · 128K 吞吐与 API 定价对比</text>
  <text x="840" y="47" text-anchor="end" fill="#52525B" font-family="monospace" font-size="16" font-weight="600">arXiv:2611.04182</text>

  <!-- Chart 1: Throughput comparison -->
  <text x="40" y="112" fill="#27272A" font-family="Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">A. 128K 上下文解码吞吐 (Tokens / sec)</text>

  <g transform="translate(40, 140)" font-family="Inter, PingFang SC, monospace">
    <text x="0" y="25" fill="#52525B" font-size="19" font-weight="600">Dense 基线</text>
    <rect x="210" y="4" width="165" height="28" fill="#E4E4E7" />
    <text x="389" y="25" fill="#52525B" font-size="20" font-weight="700">42.0 tok/s</text>

    <text x="0" y="72" fill="#3F3F46" font-size="19" font-weight="600">上一代 MLA</text>
    <rect x="210" y="51" width="260" height="28" fill="#A1A1AA" />
    <text x="484" y="72" fill="#27272A" font-size="20" font-weight="700">66.4 tok/s</text>

    <text x="0" y="119" fill="#18181B" font-size="20" font-weight="800">Sparse MLA</text>
    <rect x="210" y="98" width="400" height="28" fill="#1D4ED8" />
    <text x="624" y="120" fill="#1D4ED8" font-size="23" font-weight="800">138.6 tok/s (2.1×)</text>
  </g>

  <line x1="40" y1="296" x2="840" y2="296" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Table 2: Official Pricing & Memory -->
  <text x="40" y="336" fill="#27272A" font-family="Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">B. 官方 API 定价与首字延迟参数</text>

  <g transform="translate(40, 358)" font-family="Inter, PingFang SC, monospace">
    <rect x="0" y="0" width="800" height="40" fill="#F4F4F5" />
    <line x1="0" y1="0" x2="800" y2="0" stroke="#18181B" stroke-width="2" />
    <line x1="0" y1="40" x2="800" y2="40" stroke="#D4D4D8" stroke-width="1" />
    <text x="16" y="27" fill="#18181B" font-size="18" font-weight="800">指标项</text>
    <text x="315" y="27" fill="#52525B" font-size="18" font-weight="700">旧版本</text>
    <text x="495" y="27" fill="#18181B" font-size="18" font-weight="800">新版本</text>
    <text x="690" y="27" fill="#18181B" font-size="18" font-weight="800">变化</text>

    <text x="16" y="72" fill="#27272A" font-size="19" font-weight="600">128K 首字延迟</text>
    <text x="315" y="72" fill="#71717A" font-size="19">2.40 s</text>
    <text x="495" y="72" fill="#18181B" font-size="20" font-weight="700">1.01 s</text>
    <text x="690" y="73" fill="#1D4ED8" font-size="24" font-weight="800">-58%</text>
    <line x1="0" y1="88" x2="800" y2="88" stroke="#E4E4E7" stroke-width="1" />

    <text x="16" y="120" fill="#27272A" font-size="19" font-weight="600">百万输出定价</text>
    <text x="315" y="120" fill="#71717A" font-size="19">$2.19</text>
    <text x="495" y="120" fill="#18181B" font-size="20" font-weight="700">$0.65</text>
    <text x="690" y="121" fill="#1D4ED8" font-size="24" font-weight="800">-70%</text>
    <line x1="0" y1="136" x2="800" y2="136" stroke="#E4E4E7" stroke-width="1" />

    <text x="16" y="168" fill="#27272A" font-size="19" font-weight="600">权重与开源协议</text>
    <text x="315" y="168" fill="#71717A" font-size="18">Model License</text>
    <text x="495" y="168" fill="#18181B" font-size="20" font-weight="800">MIT 全面开源</text>
    <text x="690" y="168" fill="#18181B" font-size="18" font-weight="700">含推理内核</text>
    <line x1="0" y1="184" x2="800" y2="184" stroke="#18181B" stroke-width="2" />
  </g>
</svg>
