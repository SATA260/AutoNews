version: 1
timezone: Asia/Shanghai

collector:
  xCookieFile: storage/secrets/x-cookies.json
  maxImagesPerArticle: 4
  captureWebTables: true
  captureTweetScreenshots: true
  captureArticleSections: true
  captureGithubCards: true
  screenshotScale: 2

issue:
  # 每期条数 N 不在全局设默认值，在新建定时任务或手动触发时显式填写
  reserveFactor: 2 # 兼容旧任务配置
  minScore: 7.5 # 只播报达到重要性门槛的新闻
  allowPartial: true # 允许少于目标条数继续制作，并在 0 条入选时自动跳过
  freshnessHours: 48 # 候选新闻的默认时效
  itemConcurrency: 6 # 同时处理的条目数
  refill:
    maxRounds: 3
    useBackupSources: true
    lookbackStepHours: 24
    maxLookbackHours: 96

retry:
  reservationHoldHours: 48 # 失败/中断/取消的 run 在此时长内可随时重试；到期未重试则自动 abandoned 并释放预留文章

retention:
  keepRuns: 30 # 至少保留最近 30 期历史任务及其产物
  maxAgeDays: 30 # 超过 30 天的已完结历史任务允许清理
  maxLogAgeDays: 30 # 超过 30 天的孤立运行日志与调用记录允许清理
  autoCleanup: true # 在单期任务结束后按以上策略自动清理过期产物

editorial:
  maxRevisions: 2 # 核查打回润色的最大轮数
  sourceMaxChars: 20000 # 单个事件送入模型的原文总字数上限
  historyDedupDays: 14
  compactStyle: true # 启用紧凑型口播与要点约束
  requireImageOptIn: true # 仅在高价值素材或人工指定时配备新闻插图
  titleSkillFile: skills/heiya-title.md # 黑鸦爆款标题 Skill
  spotlightScoreThreshold: 9.2 # 达到该分值自动将当档早/晚报升级为大事件主推专场
  headlineNarrationMaxChars: 180 # 常规档头条口播总字数上限
  briefNarrationMaxChars: 95 # 次要短讯口播总字数上限
  metaTextBlacklist: [ "已依据", "以下是", "根据您提供", "作为AI", "总结如下", "值得一提的是", "综上所述", "令人瞩目的是", "标志着行业", "```" ]

contentLimits:
  # 默认值取自当前模板，模板适配器可以覆盖
  headline: 42
  leadSummary: 84
  title: 48
  shortTitle: 16
  progressLabel: 10
  category: 8
  summary: 90
  keyPointsMax: 3
  keyPoint: 28
  detail: 200
  hostComment: 46
  narrationSentence: 48

ai:
  # cli 填 clis 或 ai.providers 中的调用名称，可在网页设置中逐阶段切换。
  maxConcurrentCalls: 8
  providers:
    {
      deepseek官key:
        {
          adapter: openai-compatible,
          baseUrl: https://api.deepseek.com,
          protocol: responses,
          apiKeyFile: model-api-0d3230b9-e8ac-496f-9e2c-2f0383eb227b
        },
      icomp:
        {
          adapter: openai-compatible,
          baseUrl: https://api.icompify.com/v1,
          protocol: chat-completions,
          apiKeyFile: model-api-e2957f9b-3ddb-4572-a5c5-9335b889783f
        }
    }
  stages:
    select: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 300, retries: 2 }
    summarize: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 240, retries: 2 }
    polish: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 180, retries: 2 }
    factcheck: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 300, retries: 2 }
    package: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 240, retries: 2 }
  channels:
    - { cli: agy, model: gemini-4-hydrogen-high, retries: 2, enabled: true }
    - { cli: icomp, model: deepseek-v4.1-flash, retries: 2, enabled: true }
    - { cli: deepseek官key, model: deepseek-chat, retries: 1, enabled: true }

clis:
  codex:
    adapter: codex
    bin: codex
  agy:
    adapter: agy
    bin: /Applications/Gemini.app/Contents/Helpers/agy
    extraArgs: []
  biliup:
    adapter: generic
    bin: biliup

tts:
  provider: qwen-local # 默认主讲语音合成引擎
  guestProvider: indextts # 跨阵营嘉宾插嘴吐槽专用 IndexTTS2.5，口语与情绪更自然
  providers:
    silent: { charsPerSecond: 4.5 }
    indextts:
      backend: metal
      bin: assets/tts/bin/audiocpp_server
      model: assets/tts/models/IndexTTS2.5-GGUF/index-tts2_5-q8_0.gguf
      voices:
        deepseek:
          {
            audio: 'assets/voice/deepseek娘（白露）/白露_qwentts_clean.wav',
            text: 'assets/voice/deepseek娘（白露）/白露_qwentts_clean.txt'
          }
        gpt:
          {
            audio: 'assets/voice/gpt娘（阮梅）/阮梅_qwentts_clean.wav',
            text: 'assets/voice/gpt娘（阮梅）/阮梅_qwentts_clean.txt'
          }
        gemini:
          {
            audio: 'assets/voice/gemini娘（花火）/花火_qwentts_clean.wav',
            text: 'assets/voice/gemini娘（花火）/花火_qwentts_clean.txt'
          }
        claude:
          {
            audio: 'assets/voice/claude娘（布洛妮娅）/布洛妮娅_qwentts_clean.wav',
            text: 'assets/voice/claude娘（布洛妮娅）/布洛妮娅_qwentts_clean.txt'
          }
    qwen-local:
      backend: metal
      bin: assets/tts/bin/audiocpp_server
      model: assets/tts/models/Qwen3-TTS-12Hz-1.7B-Base-GGUF/qwen3-tts-12hz-1.7b-base-q8_0_v2.gguf
      voices:
        deepseek:
          {
            audio: 'assets/voice/deepseek娘（白露）/白露_qwentts_clean.wav',
            text: 'assets/voice/deepseek娘（白露）/白露_qwentts_clean.txt'
          }
        gpt:
          {
            audio: 'assets/voice/gpt娘（阮梅）/阮梅_qwentts_clean.wav',
            text: 'assets/voice/gpt娘（阮梅）/阮梅_qwentts_clean.txt'
          }
        gemini:
          {
            audio: 'assets/voice/gemini娘（花火）/花火_qwentts_clean.wav',
            text: 'assets/voice/gemini娘（花火）/花火_qwentts_clean.txt'
          }
        claude:
          {
            audio: 'assets/voice/claude娘（布洛妮娅）/布洛妮娅_qwentts_clean.wav',
            text: 'assets/voice/claude娘（布洛妮娅）/布洛妮娅_qwentts_clean.txt'
          }
  postprocess:
    sampleRate: 48000
    loudnessLUFS: -16
    trimSilence: true
    denoise: true
    sentenceGapMs: 240
    sectionGapMs: 0
  pauseAfterNarrate: false

template:
  active: daily-deck
  registry:
    daily-deck: { dir: templates/daily-deck, adapter: daily-deck }
    solid-color: { dir: "", adapter: solid-color } # 测试用
  cover: { dir: templates/cover-card } # 视频封面模板；删掉这一行则直接用视频第一帧作封面

render:
  theme: dark # 视频模板外观主题：dark（深色模式）| light（浅色模式）
  live2dPack: fullbody # 看板娘 Live2D 模型套组：fullbody（全身动作版）| expression（仅表情版）
  deviceScaleFactor: 2 # 超清渲染像素倍率：1 | 1.5 | 2（2x 超采样显著提升小字与截图清晰度）
  width: 1920
  height: 1080
  fps: 30
  pagePaddingSec: 1.0 # 每条口播念完后的画面停顿时间（秒）
  bgm: { file: "", volumeDb: -12, duckDb: -5 }
  # 切换下一条时的鼠标点击音效：file 留空关闭；volumeDb 音量；leadMs 比切页起点提前多少毫秒发声；postDelayMs 切页后等待多少毫秒再开始播报
  pageTurnSfx:
    {
      file: "assets/sfx/page-click.wav",
      volumeDb: -9,
      leadMs: 60,
      postDelayMs: 1000
    }

publish:
  mode: auto # manual-review | auto（auto 只在 qa 通过时自动发布）
  bilibili:
    cli: biliup
    cookieFile: ~/cookies.json # 直接复用在家目录执行 biliup login 生成的登录凭据
    tid: 231 # 科技·计算机技术（已实测 biliup 0.2.4 支持自由设置分区 ID）
    copyright: 1
    titleMax: 80
    descMax: 2000
    tagsMax: 12
    defaultTags:
      - AI
      - 人工智能
      - 科技资讯
      - AI每日报
    aiDeclaration: true # 强制开启 B 站平台 AI 生成内容声明标识
    maxDailyUploads: 2 # 严格早晚双更上限，防止高频投稿触发 B 站限流
    aiDisclaimerText: "免责声明：本视频由 AI 辅助整理、配音及画面渲染，资讯均来自公开报道，仅供参考，不构成任何投资或使用建议，具体信息请以官方最新公告为准。"

# 定时任务（执行时间 + 每期条数）不在配置文件设默认值，统一在 SQLite schedules 表中手动新建管理

notify:
  provider: none # 当前默认不发送外部通知，后续可扩展飞书等渠道
  config: {}

web:
  host: 127.0.0.1
  port: 3000
