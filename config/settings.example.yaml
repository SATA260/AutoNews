# 配置示例。真正生效的是 config/settings.yaml。
# 这里只标出 AI 渠道优先级、配音与采集相关的可选项，避免把本机密钥写进示例。

ai:
  # 按优先级排列的模型调用渠道集合：前一渠道耗尽 retries 次后自动切换至下一渠道
  channels:
    - { cli: agy, model: gemini-4-hydrogen-high, retries: 2, enabled: true }
    - { cli: codex, model: gpt-5, retries: 2, enabled: true }
  stages:
    select: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 300, retries: 2 }
    summarize: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 240, retries: 2 }
    polish: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 180, retries: 2 }
    factcheck: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 300, retries: 2 }
    package: { mode: pool, cli: agy, model: gemini-4-hydrogen-high, timeoutSec: 240, retries: 2 }

collector:
  xCookieFile: storage/secrets/x-cookies.json
  maxImagesPerArticle: 4
  captureWebTables: true
  captureTweetScreenshots: true

tts:
  provider: qwen-local
  # 配音全部完成后是否先停下来试听。false 表示配完直接继续合成视频。
  pauseAfterNarrate: false
  providers:
    silent: { charsPerSecond: 4.5 }
  postprocess:
    sampleRate: 48000
    loudnessLUFS: -16
    trimSilence: true
    denoise: true
    sentenceGapMs: 250
    sectionGapMs: 600

render:
  # 视频模板外观主题：dark（深色模式）| light（浅色模式）
  theme: dark
  # 切换下一条时的鼠标点击音效：file 留空关闭；volumeDb 音量；leadMs 比切页起点提前多少毫秒发声；postDelayMs 切页后等待多少毫秒再开始播报
  pageTurnSfx: { file: "assets/sfx/page-click.wav", volumeDb: -9, leadMs: 60, postDelayMs: 1000 }
